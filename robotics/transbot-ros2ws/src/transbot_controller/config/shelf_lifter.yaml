/**/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    lifter_pid_velocity_controller:
      type: pid_controller/PidController

/**/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/**/diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["j/mobilebase/doublebar/diff/wheel1"]
    right_wheel_names: ["j/mobilebase/doublebar/diff/wheel0"]
    wheel_separation: 0.500
    wheel_radius: 0.060
    use_stamped_vel: true
    odom_frame_id: odom 
    base_frame_id: _
    enable_odom_tf: true

/**/twist_mux:
  ros__parameters:
    topics:
      keyboard:
        topic: cmd_vel_keyboard
        timeout: 0.5
        priority: 10
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 20
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 0

/**/lifter_pid_velocity_controller:
  ros__parameters:
    use_sim_time: true
    dof_names:
      - j/lifter
    
    command_interface: velocity 
    reference_and_state_interfaces: ["velocity"]

    gains:
      j/lifter : {p: 0.5}