      keyboard:
        topic: cmd_vel_keyboard
        timeout: 0.5
        priority: 10
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 20
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 0